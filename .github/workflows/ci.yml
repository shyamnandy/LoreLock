name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # conftest.py forces these too, but setting them here means a test that
      # bypasses the fixture still cannot reach a paid provider from CI.
      LLM_PROVIDER: stub
      VALIDATOR_USE_MODEL: "0"
      # no MONGODB_URI: app/store/remote.py degrades to a no-op, so the suite
      # stays hermetic and never touches Atlas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this typechecks and
      # builds in one step -- the same command Vercel runs.
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required for cache-to/cache-from: type=gha below. The default docker
      # driver cannot export a cache, so without buildx the step fails in
      # seconds, long before it ever starts building.
      - uses: docker/setup-buildx-action@v3

      # Catches the failure mode that matters here: the image builds locally
      # but not on Render, which is where it is actually built.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
