# Render blueprint for the backend.
#
# No `disk:` block, and that is the point: persistent disks require a paid
# instance type, and the free tier rejects a blueprint that asks for one.
# Instead the container is disposable -- MongoDB Atlas is the system of
# record and app/store/remote.py rebuilds the local index on boot.
#
# The free tier sleeps after ~15 minutes of inactivity; the first request
# after a sleep pays a cold start (container boot + hydration, ~30-60s).
# To remove that, upgrade to a paid plan -- no code change is needed.
services:
  - type: web
    name: reading-companion-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # writable working copy; ephemeral by design, rehydrated at startup
      - key: DATA_DIR
        value: /data
      - key: LLM_PROVIDER
        value: groq
      # The free tier is 512 MB and indexing is what gets closest to it.
      # Explicit here rather than left to the code default so the limit is
      # visible next to the plan that imposes it. See .env.example.
      - key: EMBED_BATCH
        value: "8"
      - key: EMBED_THREADS
        value: "2"
      # --- secrets: set in the Render dashboard, never in git -------------
      - key: MONGODB_URI
        sync: false          # mongodb+srv://... from Atlas
      - key: GROQ_API_KEY
        sync: false          # console.groq.com/keys
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
